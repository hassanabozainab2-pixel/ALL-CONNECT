plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.allconnect.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.allconnect.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1-preview'
    }
    buildTypes {
        release {
            // Preview-only signing with the runner's debug certificate.
            // Replace with a private, persistent release key before public distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
